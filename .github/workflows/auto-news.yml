name: Automated News Pipeline (RSAIN)

# Pemicu utama: pemicu eksternal (cron-job.org) memanggil workflow_dispatch tepat 10:35 dan
# 22:05 WIB dengan nama edisi eksplisit (lihat docs/jadwal-tayang.md).
# Cron GitHub di bawah hanya cadangan: antrean schedule GitHub molor 4-7 jam, jadi run
# terjadwal dilewati bila edisi yang sama sudah tayang dalam 10 jam terakhir.
on:
  schedule:
    # 10:35 WIB (UTC+7) = 03:35 UTC (menghindari antrean padat di menit :00 dan :30)
    - cron: '35 3 * * *'
    # 22:05 WIB (UTC+7) = 15:05 UTC (menghindari antrean padat di menit :00)
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Pilih jadwal tayang'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pagi
          - malam
      limit:
        description: 'Kuota berita tayang per edisi'
        required: false
        default: '3'
        type: string
      dryRun:
        description: 'Mode simulasi (tanpa simpan/deploy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  # Untuk issue laporan "kuota edisi belum terpenuhi" di langkah terakhir.
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    name: Generate News & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Wajib main terbaru, bukan SHA saat run dipicu. Run yang antre di grup concurrency
          # harus melihat artikel edisi sebelumnya, kalau tidak sumber yang sama terbit dua kali.
          ref: main
          fetch-depth: 0

      # Edisi: input dispatch (pagi/malam) > jadwal cron yang memicu > kosong (skrip menebak dari jam WIB).
      # Run terjadwal dilewati bila edisi yang sama sudah tayang dalam 10 jam terakhir
      # (penanda "edition=<nama>" ada di pesan commit). Dispatch selalu jalan.
      - name: Resolve edition and check duplicate broadcast
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EDITION: ${{ inputs.edition }}
          CRON: ${{ github.event.schedule }}
        run: |
          EDITION=""
          if [ "$INPUT_EDITION" = "pagi" ] || [ "$INPUT_EDITION" = "malam" ]; then
            EDITION="$INPUT_EDITION"
          elif [ "$CRON" = "35 3 * * *" ]; then
            EDITION="pagi"
          elif [ "$CRON" = "5 15 * * *" ]; then
            EDITION="malam"
          fi
          echo "name=$EDITION" >> "$GITHUB_OUTPUT"
          echo "Edisi: ${EDITION:-auto (ditebak dari jam WIB)}"

          SKIP=false
          if [ "$EVENT_NAME" = "schedule" ] && [ -n "$EDITION" ]; then
            if [ -n "$(git log --since='10 hours ago' --grep="edition=$EDITION" --format=%h origin/main)" ]; then
              SKIP=true
              echo "::notice title=Run cadangan dilewati::Edisi $EDITION sudah tayang dalam 10 jam terakhir."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.edition.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.edition.outputs.skip != 'true'
        run: npm ci

      - name: Run automated AI news generation
        id: generate
        if: steps.edition.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'minimax/minimax-m3' }}
          EDITION: ${{ steps.edition.outputs.name }}
          LIMIT: ${{ inputs.limit || '3' }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          ARGS="--limit=$LIMIT"
          if [ -n "$EDITION" ]; then
            ARGS="$ARGS --edition=$EDITION"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/generate-news.mjs $ARGS

      - name: Run test suite
        if: steps.edition.outputs.skip != 'true'
        run: npm run test

      - name: Build static site with Astro
        if: steps.edition.outputs.skip != 'true'
        run: npm run build

      # Commit hanya setelah test & build lulus, agar artikel rusak tidak masuk ke main.
      - name: Commit and push new articles to main branch
        if: ${{ steps.edition.outputs.skip != 'true' && inputs.dryRun != true }}
        env:
          EDITION: ${{ steps.edition.outputs.name }}
        run: |
          if [ -n "$(git status --porcelain src/content/news)" ]; then
            git config --global user.name "Redaktur Sinyal AI News (RSAIN)"
            git config --global user.email "rsain@sinyalai.users.noreply.github.com"
            git add src/content/news/
            # Penanda edition=<nama> dipakai penjaga run cadangan di atas.
            git commit -m "chore(news): automated edition broadcast [skip ci]" -m "edition=${EDITION:-auto}"
            # main bisa berubah selama job berjalan (mis. PR di-merge). Tarik dulu dengan rebase
            # agar push tidak ditolak dan artikel edisi ini tidak hilang. Ulangi bila ada yang menyela.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              echo "Push gagal pada percobaan $attempt, mengulang..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "Push ke main gagal setelah 3 percobaan."
            exit 1
          else
            echo "Tidak ada artikel baru yang dihasilkan pada jadwal tayang ini."
          fi

      # Setelah rebase, main mungkin memuat perubahan kode baru. Bangun ulang agar situs yang
      # di-deploy sama dengan isi main, bukan snapshot saat job dimulai.
      - name: Rebuild site from synced main
        if: ${{ steps.edition.outputs.skip != 'true' && inputs.dryRun != true }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: ${{ steps.edition.outputs.skip != 'true' && inputs.dryRun != true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: ${{ steps.edition.outputs.skip != 'true' && inputs.dryRun != true }}
        id: deployment
        uses: actions/deploy-pages@v5

      # Situs tetap di-deploy di atas, tetapi kuota yang tidak terpenuhi tidak boleh lewat diam-diam:
      # buka (atau perbarui) satu issue per edisi per hari, dan buat run MERAH bila 0 berita tayang
      # supaya GitHub mengirim notifikasi gagal.
      - name: Report unmet edition quota
        if: ${{ steps.edition.outputs.skip != 'true' && inputs.dryRun != true && steps.generate.outputs.published != steps.generate.outputs.quota }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.generate.outputs.published }}
          QUOTA: ${{ steps.generate.outputs.quota }}
          LABEL: ${{ steps.generate.outputs.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Kuota edisi belum terpenuhi: $LABEL, $(TZ=Asia/Jakarta date +%F)"
          BODY="$LABEL menayangkan **$PUBLISHED dari $QUOTA** berita.

          Penyebab biasanya stok rilis sumber habis (sudah terpakai, terlalu tua, atau konteksnya tipis). Rincian ada di log langkah \"Run automated AI news generation\": $RUN_URL

          Tindakan: tambah sumber di \`scripts/sources.json\`, atau jalankan ulang edisi secara manual bila sumber baru sudah terbit."
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Run ulang: $PUBLISHED dari $QUOTA berita tayang. $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          if [ "$PUBLISHED" = "0" ]; then
            echo "::error title=Tidak ada berita tayang::$LABEL menayangkan 0 dari $QUOTA berita."
            exit 1
          fi
