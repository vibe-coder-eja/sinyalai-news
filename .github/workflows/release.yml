name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Catatan rilis diambil dari bagian versi yang sama di CHANGELOG.md (tag v0.7.0 -> "## [0.7.0]").
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md \
            | grep -v '^---$' | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "Catatan untuk versi $VERSION tidak ditemukan di CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Sinyal AI News $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
